<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devine le nombre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Devine le nombre</h1>
    <p>J'ai choisi un nombre entre 1 et 100. À toi de le trouver !</p>

    <form id="formulaire">
      <input id="essai" type="number" min="1" max="100" required autofocus>
      <button type="submit">Essayer</button>
    </form>

    <p id="message"></p>
    <p id="compteur">Essais : 0</p>
    <p id="record">Meilleur score : —</p>
    <button id="rejouer" hidden>Rejouer</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
